services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:2.4.0
    container_name: uptime-kuma
    restart: unless-stopped
    expose:
      # Uptime Kuma serves HTTP on port 3001 inside the container.
      - "3001"
    volumes:
      # Uptime Kuma stores monitors, history, and status data here.
      - ${HOMELAB_STATE_DIR:-/homelab/state}/uptime-kuma/data:/app/data
    networks:
      - proxy
