services:
  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_IMAGE_TAG:-v1.13.2}
    container_name: homepage
    restart: unless-stopped
    expose:
      # Homepage serves HTTP on port 3000 inside the container.
      - "3000"
    environment:
      # Required by Homepage when accessed through the Caddy reverse proxy.
      HOMEPAGE_ALLOWED_HOSTS: homepage.home.arpa
      # Homepage's Technitium widget uses a dedicated API token from `.env`.
      HOMEPAGE_VAR_TECHNITIUM_API_KEY: ${HOMEPAGE_VAR_TECHNITIUM_API_KEY:-}
      # Homepage's Uptime Kuma widget reads a local status page by slug.
      HOMEPAGE_VAR_UPTIME_KUMA_STATUS_SLUG: ${HOMEPAGE_VAR_UPTIME_KUMA_STATUS_SLUG:-homelab}
    volumes:
      - ./config:/app/config
    networks:
      - proxy
