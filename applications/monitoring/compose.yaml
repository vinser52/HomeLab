services:
  grafana:
    image: docker.io/grafana/grafana:12.1.0
    container_name: grafana
    restart: unless-stopped
    user: "${HOMELAB_UID}:${HOMELAB_GID}"
    expose:
      # Grafana serves HTTP on port 3000 inside the container.
      - "3000"
    environment:
      GF_SERVER_DOMAIN: grafana.home.arpa
      GF_SERVER_ROOT_URL: https://grafana.home.arpa
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Grafana runtime state lives outside Git under the HomeLab state directory.
      - ${HOMELAB_STATE_DIR:-/homelab/state}/grafana/data:/var/lib/grafana
      # Desired datasources and dashboards are provisioned from Git-managed config.
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - proxy

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    user: "${HOMELAB_UID}:${HOMELAB_GID}"
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle
    expose:
      # Prometheus stays internal and is used by Grafana over Docker networking.
      - "9090"
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ${HOMELAB_STATE_DIR:-/homelab/state}/prometheus/data:/prometheus
    networks:
      - proxy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    expose:
      # cAdvisor stays internal and is scraped only by Prometheus.
      - "8080"
    volumes:
      # Read-only host and Docker runtime paths let cAdvisor report container metrics.
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      # Allows cAdvisor to collect disk usage details without privileged mode.
      - /dev/kmsg:/dev/kmsg
    networks:
      - proxy

  fritz-exporter:
    image: docker.io/pdreker/fritz_exporter:3.2.2
    container_name: fritz-exporter
    restart: unless-stopped
    expose:
      # fritz-exporter stays internal and is scraped only by Prometheus.
      - "9787"
    environment:
      FRITZ_NAME: FritzBox
      FRITZ_HOSTNAME: ${FRITZBOX_ROUTER_IP:-}
      FRITZ_USERNAME: ${FRITZ_EXPORTER_USERNAME:-}
      FRITZ_PASSWORD: ${FRITZ_EXPORTER_PASSWORD:-}
      # v3 defaults to 127.0.0.1; Prometheus needs to reach it over Docker networking.
      FRITZ_LISTEN_ADDRESS: 0.0.0.0
      FRITZ_PORT: "9787"
      FRITZ_LOG_LEVEL: INFO
      # Extended per-host data can take 20+ seconds on busy networks.
      FRITZ_HOST_INFO: "false"
    networks:
      - proxy

  technitium-exporter:
    image: ghcr.io/guycalledseven/technitium-dns-prometheus-exporter:v2.0.1
    container_name: technitium-exporter
    restart: unless-stopped
    expose:
      # technitium-exporter stays internal and is scraped only by Prometheus.
      - "9105"
    environment:
      TECHNITIUM_BASE_URL: http://technitium:5380
      TECHNITIUM_TOKEN: ${TECHNITIUM_API_TOKEN:-}
      TECHNITIUM_STATS_RANGE: LastHour
      TECHNITIUM_TOP_LIMIT: "25"
      EXPORTER_PORT: "9105"
      SERVER_LABEL: technitium
      LOG_LEVEL: INFO
    depends_on:
      - technitium
    networks:
      - proxy

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    # Host network and PID visibility are required for accurate host-level metrics.
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/snapd/.+|var/snap/.+|snap/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    volumes:
      # Read-only host root lets node-exporter report Ubuntu host metrics.
      - /:/host:ro,rslave
