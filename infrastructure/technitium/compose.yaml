services:
  technitium:
    image: docker.io/technitium/dns-server:15.2.0
    container_name: technitium-dns
    hostname: technitium-dns
    restart: unless-stopped
    ports:
      # DNS uses TCP/UDP port 53 directly and cannot be proxied through Caddy.
      - "${HOMELAB_SERVER_IP:-192.168.178.2}:53:53/tcp"
      - "${HOMELAB_SERVER_IP:-192.168.178.2}:53:53/udp"
    expose:
      # Web UI is reachable inside Docker only; Caddy publishes it as dns.home.arpa.
      - "5380"
    environment:
      DNS_SERVER_DOMAIN: ${LOCAL_DOMAIN:-home.arpa}
      DNS_SERVER_ADMIN_PASSWORD: ${DNS_SERVER_ADMIN_PASSWORD}
      # Recursive resolution is limited to private networks on the LAN.
      DNS_SERVER_RECURSION: AllowOnlyForPrivateNetworks
      DNS_SERVER_LOG_USING_LOCAL_TIME: "true"
      DNS_SERVER_LOG_FOLDER_PATH: /var/log/technitium/dns
    volumes:
      - ./data/config:/etc/dns
      - ./data/logs:/var/log/technitium/dns
    # Expands the ephemeral source port range to match the upstream example.
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    networks:
      - proxy
