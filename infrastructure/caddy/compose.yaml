services:
  caddy:
    image: docker.io/library/caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - technitium
    ports:
      # HTTP remains published for compatibility and local troubleshooting.
      - "${HOMELAB_SERVER_IP:-192.168.178.2}:80:80/tcp"
      # HTTPS is LAN-only and uses Caddy's internal CA.
      - "${HOMELAB_SERVER_IP:-192.168.178.2}:443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOMELAB_STATE_DIR:-/homelab/state}/caddy/data:/data
      - ${HOMELAB_STATE_DIR:-/homelab/state}/caddy/config:/config
    networks:
      - proxy
